name: Buduj Suno Generator APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Pobierz repozytorium
        uses: actions/checkout@v4

      - name: Rozpakuj projekt
        run: unzip -o SunoGenerator-Android-2.0.zip -d projekt

      - name: Znajdź Gradle
        run: |
          GRADLEW=$(find projekt -name gradlew -type f | head -n 1)
          if [ -z "$GRADLEW" ]; then
            echo "Nie znaleziono pliku gradlew"
            exit 1
          fi
          chmod +x "$GRADLEW"
          echo "GRADLEW=$GRADLEW" >> "$GITHUB_ENV"
          echo "KATALOG=$(dirname "$GRADLEW")" >> "$GITHUB_ENV"

      - name: Zbuduj APK
        working-directory: ${{ env.KATALOG }}
        run: ./gradlew assembleDebug

      - name: Udostępnij APK
        uses: actions/upload-artifact@v4
        with:
          name: SunoGenerator-2.0-APK
          path: "**/build/outputs/apk/**/*.apk"
